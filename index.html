<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2563eb" />
<title>Dealer Order Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#dbeafe;
    --green:#16a34a; --green-light:#dcfce7;
    --red:#dc2626; --red-light:#fee2e2;
    --grey:#f1f5f9; --grey-2:#e2e8f0; --text:#0f172a; --muted:#64748b;
    --border:#cbd5e1;
    --safe-top: env(safe-area-inset-top, 35px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Bengali", sans-serif;
    background: var(--grey); color: var(--text); font-size: 14px; line-height:1.4;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button{ cursor:pointer; border:none; background:none; }
  input,select,textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    background:#fff; outline:none; transition:border .15s;
  }
  input:focus, select:focus, textarea:focus{ border-color: var(--blue); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:8px; font-weight:600; font-size:14px;
    transition: transform .1s, opacity .15s;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background: var(--blue); color:#fff; }
  .btn-success{ background: var(--green); color:#fff; }
  .btn-danger{ background: var(--red); color:#fff; }
  .btn-outline{ background:#fff; color: var(--blue); border:1px solid var(--blue); }
  .btn-ghost{ background:#fff; border:1px solid var(--border); color: var(--text); }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn-block{ width:100%; }
  .card{ background:#fff; border-radius:12px; padding:14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .hidden{ display:none !important; }
  .flex{ display:flex; }
  .gap8{ gap:8px; }
  .flex-between{ display:flex; justify-content:space-between; align-items:center; }
  .muted{ color: var(--muted); }
  .small{ font-size:12px; }
  .center{ text-align:center; }
  .field{ margin-bottom:12px; width:100%; }
  .field label{ display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:#334155; }
  .modal-body .field, .modal-body h4{ background:transparent; }
  .tag{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .tag-pending{ background:#fef3c7; color:#92400e; }
  .tag-approved{ background: var(--green-light); color:#166534; }
  .tag-core{ background:#dbeafe; color:#1e40af; }
  .tag-premium{ background:#fce7f3; color:#9d174d; }
  .tag-value{ background:#ede9fe; color:#5b21b6; }
  .tag-emergency{ background:#fee2e2; color:#991b1b; }

  #app{ display:flex; flex-direction:column; min-height:100vh; padding-top: var(--safe-top); }
  .app-header{
    background:#fff; border-bottom:1px solid var(--grey-2); padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:30;
  }
  .app-header h1{ font-size:15px; margin:0; font-weight:700; }
  .app-header .sub{ font-size:11px; color: var(--muted); }

  .app-body{ flex:1; padding:16px; padding-bottom: 100px; max-width:720px; margin:0 auto; width:100%; }

  .app-nav{
    display:flex; background:#fff; border-top:1px solid var(--grey-2);
    position:fixed; bottom: 0px; left:0; right:0; z-index:999; padding: 4px 0;
    padding-bottom: calc(4px + var(--safe-bottom));
    overflow: hidden;
  }
  .app-nav button{
    flex:1; padding:8px 0; display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--muted); font-size:10px; font-weight:600;
    background: transparent; border: none; outline: none;
    transition: color 0.2s;
  }
  .app-nav button.active{ color: var(--blue); }
  .app-nav svg{ width:20px; height:20px; }

  .welcome-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%); padding: 20px; text-align: center;
  }
  .welcome-screen h1 { font-size: 22px; color: var(--blue); margin-bottom: 8px; }
  .welcome-screen p { font-size: 14px; color: var(--muted); margin-bottom: 40px; }
  .btn-circle {
    width: 120px; height: 120px; border-radius: 50%; background: #fff; border: 2px solid var(--blue);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--blue); font-size: 18px; font-weight: 700; box-shadow: 0 4px 15px rgba(37,99,235,0.2);
    cursor: pointer; transition: transform 0.2s;
  }
  .btn-circle:active { transform: scale(0.95); }

  .dash-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .dash-card{ background:#fff; border-radius:12px; padding:14px; border-left:4px solid var(--blue); }
  .dash-card .num{ font-size:22px; font-weight:700; color: var(--text); }
  .dash-card .lbl{ font-size:12px; color: var(--muted); }
  .dash-card.green{ border-left-color: var(--green); }
  .dash-card.amber{ border-left-color:#f59e0b; }

  .order-screen{ display:flex; flex-direction:column; height: 100dvh; position: fixed; top:0; left:0; right:0; z-index:50; background: var(--grey); padding-top: var(--safe-top); }
  .order-toolbar{ padding:8px 12px; background:#fff; border-bottom:1px solid var(--grey-2); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .order-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; padding: 0 0 8px; -webkit-overflow-scrolling: touch; }
  .prod-header{
    display:grid; grid-template-columns: 1.5fr 50px 75px 1.2fr;
    gap:4px; padding:10px 8px; font-size:11px; font-weight:700; color: var(--muted);
    background: var(--grey); position:sticky; top:0; z-index:5;
    border-bottom:1px solid var(--grey-2); text-transform: uppercase;
  }
  .prod-row{
    display:grid; grid-template-columns: 1.5fr 50px 75px 1.2fr;
    gap:4px; padding:10px 8px; border-bottom:1px solid #f1f5f9; align-items:center; background:#fff;
  }
  .prod-row .pname{ font-weight:700; font-size:12px; line-height: 1.2; word-break: break-word; }
  .prod-row .amt{ text-align:right; font-weight:700; font-size:12px; color: var(--blue); white-space:nowrap; }
  .prod-row .flavors{ display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .flavor-cell{ display:flex; flex-direction:column; gap:2px; min-width:48px; }
  .flavor-cell label{ font-size:10px; color: var(--muted); text-align:center; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flavor-cell input{ padding:6px 0; text-align:center; font-size:12px; border-radius:6px; border: 1px solid var(--border); }
  .prod-row .direct-inp{ padding:6px 0; text-align:center; font-size:12px; border-radius:6px; }
  .prod-total-qty{ text-align:center; font-weight:700; font-size:13px; color: var(--text); }

  .fixed-summary{
    background:#fff; border-top:2px solid var(--blue);
    padding: 6px 10px; box-shadow: 0 -4px 12px rgba(0,0,0,.06); z-index:20; flex-shrink: 0;
    padding-bottom: calc(6px + var(--safe-bottom));
  }
  .fs-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 800; }
  .fs-top-row .lbl { color: var(--muted); }
  .fs-top-row .v { color: var(--blue); }
  .offer-hint{ font-size:10px; color:var(--green); font-weight:700; margin-bottom:4px; text-align:right; }

  .fs-bottom-row { display: flex; gap: 6px; align-items: center; }
  .slab-wrap { display: flex; align-items: center; gap: 6px; flex: 1; background: var(--grey); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); }
  .slab-wrap input { padding: 4px; width: 45px; text-align: center; font-weight: 700; font-size: 13px; border: 1px solid var(--border); border-radius: 4px; }
  .slab-live-total { font-size: 11px; font-weight: 700; color: var(--green); white-space: nowrap; }

  .fs-bottom-row .btn { flex-shrink: 0; padding: 8px 12px; font-size: 13px; }

  .list-item{ background:#fff; border-radius:10px; padding:12px; margin-bottom:8px; border:1px solid var(--grey-2); }
  .list-item .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .list-item .title{ font-weight:700; font-size:14px; }
  .list-item .meta{ font-size:12px; color: var(--muted); }
  .list-item .actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .icon-btn{ width:34px; height:34px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; background: var(--grey); color: var(--text); border:1px solid var(--grey-2); }
  .icon-btn.danger{ background: var(--red-light); color: var(--red); border-color:#fecaca; }
  .icon-btn.primary{ background: var(--blue-light); color: var(--blue); border-color:#bfdbfe; }
  .icon-btn.success{ background: var(--green-light); color: var(--green); border-color:#bbf7d0; }
  .icon-btn svg{ width:16px; height:16px; }

  .result-stats{ display:flex; gap:8px; margin-bottom:12px; }
  .result-stats .rs{ flex:1; background:#fff; border-radius:10px; padding:10px; text-align:center; border:1px solid var(--grey-2); }
  .result-stats .rs b{ display:block; font-size:18px; }
  .result-stats .rs.ok b{ color: var(--green); }
  .result-stats .rs.wait b{ color:#b45309; }

  .modal-overlay{ position:fixed; inset:0; background: rgba(15,23,42,.7); display:flex; align-items:center; justify-content:center; z-index:1000; animation: fadeIn .15s; padding: 10px; padding-top: var(--safe-top); }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal{
    background:#fff; width:100%; max-width:600px; max-height:90vh;
    border-radius: 16px; display:flex; flex-direction:column; animation: slideUp .2s;
  }
  @keyframes slideUp{ from{ transform: translateY(20px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .modal.fullscreen { max-width: 100%; width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; margin:0; }
  .modal-head{ padding:14px 16px; border-bottom:1px solid var(--grey-2); display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius: 16px 16px 0 0; }
  .modal.fullscreen .modal-head { border-radius: 0; }
  .modal-head h3{ margin:0; font-size:16px; }
  .modal-body{ padding:14px; overflow-y:auto; flex:1; background:#e2e8f0; display:flex; flex-direction:column; align-items:center; }
  .modal-foot{ padding:12px 16px; border-top:1px solid var(--grey-2); display:flex; gap:8px; justify-content:flex-end; background:#fff; flex-wrap: wrap; border-radius: 0 0 16px 16px; }

  #toast{
    position:fixed; bottom: 80px; left:50%; transform: translateX(-50%);
    background:#0f172a; color:#fff; padding:10px 18px; border-radius:8px;
    font-size:13px; font-weight:600; z-index:2000; opacity:0; pointer-events:none; transition: opacity .2s; max-width:90%;
  }
  #toast.show{ opacity:1; }

  .invoice-preview{ background:#fff; padding:10px; width: 100%; margin: 0 auto; }
  .sheet-table{ width: 100%; border-collapse:collapse; border:1px solid #000; table-layout: fixed; font-size: 13px; color: #000; font-weight: bold; }
  .sheet-table td { border:1px solid #000; padding:6px 4px; vertical-align:middle; word-wrap: break-word; line-height: 1.3; }
  .sheet-table .text-center{ text-align:center; }
  .sheet-table .text-right{ text-align:center; }

  .bg-header-green { background-color:#c6e0b4; font-weight:bold; text-align:center; }
  .bg-header-orange{ background-color:#f8cbad; font-weight:bold; text-align:center; }
  .bg-cat-blue     { background-color:#9bc2e6; font-weight:bold; }
  .bg-cat-green    { background-color:#a9d08e; font-weight:bold; }
  .bg-cat-yellow   { background-color:#fff2cc; font-weight:bold; }
  .bg-cat-orange   { background-color:#f4b084; font-weight:bold; }
  .bg-subtotal     { background-color:#e2f0d9; font-weight:bold; }
  .bg-grandtotal   { background-color:#ffeb9c; font-weight:bold; }
  .bg-offer        { background-color:#f8cbad; font-weight:bold; }

  .flavor-text { white-space: normal; font-size: 12px; font-weight: bold; }

  .dealer-pick-grid{ display:grid; grid-template-columns:1fr; gap:8px; width:100%; }
  .dealer-pick-card{ background:#fff; border-radius:10px; padding:12px 14px; border:1px solid var(--grey-2); display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="image-render-area" style="position: absolute; left: -9999px; top: 0; width: 800px; background:#fff; padding:20px;"></div>

<script>
const DB_KEY = 'dealer_order_app_v24_final';

const SHEET_PRESETS = [
  { cat:'Core', name:'Chocobar - Mini', flavors:[], price:640.00 },
  { cat:'Core', name:'Regular Chocobar', flavors:[], price:717.25 },
  { cat:'Core', name:'Lolly', flavors:['Lemon','Orange'], price:465.00 },
  { cat:'Core', name:'Shell & Core', flavors:['Strawberry','Mango'], price:694.00 },
  { cat:'Core', name:'Dudh Malai', flavors:[], price:504.75 },
  { cat:'Core', name:'Mini ikone', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:824.25 },
  { cat:'Core', name:'ikone', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:752.00 },
  { cat:'Core', name:'Regular Cup', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:425.00 },
  { cat:'Core', name:'Regular - 500ml', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:125.00 },
  { cat:'Core', name:'Regular - 1 Liter', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:236.00 },
  { cat:'Core', name:'Regular - 2 Liter', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:389.00 },
  { cat:'Core', name:'Regular - 5 Liter', flavors:['Vanilla','Strawberry','Mango','Chocolate'], price:920.00 },
  { cat:'Value Added', name:'Crunchie Bar - Mini', flavors:[], price:633.00 },
  { cat:'Value Added', name:'Crunchie Bar', flavors:[], price:862.50 },
  { cat:'Value Added', name:'Single Sundae', flavors:['Strawberry','Mango','Coffee'], price:472.20 },
  { cat:'Value Added', name:'Double Sundae', flavors:['Strawberry','Mango','Chocolate'], price:268.50 },
  { cat:'Emerging', name:'Ekdom Aam Sorbet', flavors:[], price:700.00 },
  { cat:'Emerging', name:'Shahi Kheer (Clay Pot)', flavors:[], price:825.00 },
  { cat:'Emerging', name:'Cake', flavors:['Vanilla','Chocolate','Red Velvet'], price:860.00 },
  { cat:'Premium', name:'Discone', flavors:['Vanilla','Chocolate'], price:463.00 },
  { cat:'Premium', name:'Kheer Malai Cup', flavors:[], price:690.00 },
  { cat:'Premium', name:'Doi Cup', flavors:[], price:690.00 },
  { cat:'Premium', name:'Mawa Kulfi Cup', flavors:[], price:690.00 },
  { cat:'Premium', name:'Caramel Cup', flavors:[], price:690.00 },
  { cat:'Premium', name:'Chocolate Fudge Cup', flavors:[], price:782.00 },
  { cat:'Premium', name:'Coffee Cup', flavors:[], price:782.00 },
  { cat:'Premium', name:'Butterscotch Cup', flavors:[], price:782.00 },
  { cat:'Premium', name:'Doi - 1 Liter', flavors:[], price:327.00 },
  { cat:'Premium', name:'Kheer Malai - 1 Liter', flavors:[], price:327.00 },
  { cat:'Premium', name:'Coffee - 1 Liter', flavors:[], price:383.00 },
  { cat:'Premium', name:'Caramel - 1 Liter', flavors:[], price:327.00 },
  { cat:'Premium', name:'Mawa Kulfi - 1 Liter', flavors:[], price:327.00 },
  { cat:'Premium', name:'Chocolate Fudge - 1 Liter', flavors:[], price:383.00 },
  { cat:'Premium', name:'Butterscotch - 1 Liter', flavors:[], price:383.00 },
  { cat:'Premium', name:'Caramel 5 Liter', flavors:[], price:1350.00 },
  { cat:'Premium', name:'Chocolate Fudge 5 Liter', flavors:[], price:1900.00 },
  { cat:'Premium', name:'Butterscotch 5 Liter', flavors:[], price:1900.00 }
];

const CATEGORY_META = {
  'Core':        { id:'cat_core',   tag:'core',      order:1 },
  'Value Added': { id:'cat_value',  tag:'value',     order:2 },
  'Emerging':    { id:'cat_emerg',  tag:'emergency', order:3 },
  'Premium':     { id:'cat_prem',   tag:'premium',   order:4 }
};

const Store = {
  _cache: null,
  _read() {
    if(this._cache) return this._cache;
    try {
      let raw = localStorage.getItem(DB_KEY);
      if(!raw) {
        const seeded = this._seed();
        this._write(seeded);
        this._cache = seeded;
        return seeded;
      }
      this._cache = JSON.parse(raw);
      return this._cache;
    } catch(e) {
      const seeded = this._seed();
      this._write(seeded);
      this._cache = seeded;
      return seeded;
    }
  },
  _write(data) { this._cache = data; try { localStorage.setItem(DB_KEY, JSON.stringify(data)); } catch(e) {} },
  _seed() {
    const categories = Object.entries(CATEGORY_META).map(([name, m]) => ({ id: m.id, name, order: m.order, tag: m.tag }));
    const catByName = {}; categories.forEach(c => catByName[c.name] = c);
    const products = SHEET_PRESETS.map((p, i) => ({
      id: 'pr_seed_' + i, categoryId: catByName[p.cat] ? catByName[p.cat].id : 'cat_core',
      name: p.name, price: p.price, order: i + 1, flavors: p.flavors.slice()
    }));
    return {
      admin: { name: 'MD SAFAYAT HOSSAIN', username: 'SAFAYAT', password: '72.89' },
      dealers: [{ id: 'dl_user', name: 'MD SAFAYAT HOSSAIN', code: 'USER', slabs: {} }],
      categories, products,
      offers: [{id:'of_1', name:'ঈদ অফার', start:'2020-01-01', end:'2030-12-31', slabAmount:5000, freeProduct:'Chocobar - Mini', freeCarton:1, isActive:true}],
      orders: [], counters: { invoice: 1000 }
    };
  },
  getAdmin() { return this._read().admin; },
  setAdmin(admin) { const d=this._read(); d.admin=admin; this._write(d); },
  getDealers() { return this._read().dealers.slice(); },
  getDealerById(id) { return this._read().dealers.find(x=>x.id===id) || null; },
  addDealer(d) { const data=this._read(); data.dealers.push(d); this._write(data); },
  updateDealer(d) { const data=this._read(); const i=data.dealers.findIndex(x=>x.id===d.id); if(i>=0) data.dealers[i]=d; this._write(data); },
  deleteDealer(id) { const data=this._read(); data.dealers=data.dealers.filter(x=>x.id!==id); this._write(data); },
  getCategories() { return this._read().categories.slice().sort((a,b)=>a.order-b.order); },
  getProducts() { return this._read().products.slice().sort((a,b)=>a.order-b.order); },
  getProductById(id) { return this._read().products.find(x=>x.id===id) || null; },
  addProduct(p) { const data=this._read(); data.products.push(p); this._write(data); },
  updateProduct(p) { const data=this._read(); const i=data.products.findIndex(x=>x.id===p.id); if(i>=0) data.products[i]=p; this._write(data); },
  deleteProduct(id) { const data=this._read(); data.products=data.products.filter(x=>x.id!==id); this._write(data); },
  getOffers() { return this._read().offers.slice(); },
  addOffer(o) { const data=this._read(); data.offers.push(o); this._write(data); },
  updateOffer(o) { const data=this._read(); const i=data.offers.findIndex(x=>x.id===o.id); if(i>=0) data.offers[i]=o; this._write(data); },
  deleteOffer(id) { const data=this._read(); data.offers=data.offers.filter(x=>x.id!==id); this._write(data); },
  getActiveOfferOn(dateStr) {
    if(!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    return this._read().offers.find(o=>{
      if(!o.isActive) return false;
      const s = new Date(o.start + 'T00:00:00'); const e = new Date(o.end + 'T23:59:59');
      return d >= s && d <= e;
    }) || null;
  },
  getOrders() { return this._read().orders.slice().sort((a,b)=> b.createdAt - a.createdAt); },
  getOrderById(id) { return this._read().orders.find(x=>x.id===id) || null; },
  getOrdersByDealer(dealerId) { return this.getOrders().filter(o=>o.dealerId===dealerId); },
  addOrder(o) { const data=this._read(); o.invoiceNo = 'ORD-' + (++data.counters.invoice); data.orders.push(o); this._write(data); return o; },
  updateOrder(o) { const data=this._read(); const i=data.orders.findIndex(x=>x.id===o.id); if(i>=0) data.orders[i]=o; this._write(data); },
  deleteOrder(id) { const data=this._read(); data.orders=data.orders.filter(x=>x.id!==id); this._write(data); },
};

const Auth = {
  SESSION_KEY: 'dealer_order_session_v24',
  loginAdmin(username, password) {
    const a = Store.getAdmin();
    if(!a || a.username !== username || a.password !== password) return { ok:false, msg:'ভুল Username বা Password' };
    try { localStorage.setItem(this.SESSION_KEY, JSON.stringify({ role:'admin', username })); } catch(e) {}
    return { ok:true };
  },
  logoutAdmin() { try { localStorage.removeItem(this.SESSION_KEY); } catch(e) {} }
};

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = (p='id') => p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
const fmt = (n) => new Intl.NumberFormat('en-IN').format(Math.round(Number(n)||0));

const formatDate = (iso) => { if(!iso) return ''; const d = new Date(iso + (iso.length===10?'T00:00:00':'')); return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); };

/* --- Mobile Back Button Handling --- */
function askLogout(isAdmin) {
  showModal({
    title: 'লগ আউট',
    body: `<div style="width:100%; background:#fff; padding:18px 12px; border-radius:10px; text-align:center; font-weight:700; font-size:15px;">আপনি কি লগ আউট করতে চান?</div>`,
    buttons: [
      { label:'না', class:'btn-ghost', onClick: closeModal },
      { label:'হ্যাঁ, লগ আউট', class:'btn-danger', onClick: ()=>{
        closeModal();
        App.draft = null; App.dealerTab = 'home';
        if(isAdmin) {
          Auth.logoutAdmin(); App.isAdminView = false; App.adminTab = 'dashboard';
        } else {
          App.screen = 'welcome';
        }
        render();
      }}
    ]
  });
}

function handleBack() {
  if(mb) { closeModal(); return true; }
  if(App.screen === 'welcome') return false;

  if(App.isAdminView) {
    if(App.adminTab !== 'dashboard') { App.adminTab = 'dashboard'; renderAdmin(); }
    else askLogout(true);
    return true;
  }

  if(App.dealerTab !== 'home') { App.dealerTab = 'home'; App.draft = null; render(); }
  else askLogout(false);
  return true;
}

let guardPending = true;
function pushGuard() {
  try { history.pushState({ guard:true }, ''); } catch(e) {}
}
function setupBackHandler() {
  try {
    history.replaceState({ base:true }, '');
    pushGuard();
    guardPending = true;

    const onGesture = () => {
      if(guardPending) { pushGuard(); guardPending = false; }
    };
    ['pointerdown','touchstart','mousedown','click','keydown'].forEach(ev => {
      document.addEventListener(ev, onGesture, { capture:true, passive:true });
    });

    window.addEventListener('popstate', () => {
      const handled = handleBack();
      if(handled) {
        pushGuard();
        guardPending = true;
      } else {
        try { history.back(); } catch(e) {}
      }
    });
  } catch(e) {}
}

function renderAdminTab() {
  const body = $('#admin-body');
  if(!body) return;
  if(App.adminTab === 'dashboard') body.innerHTML = viewAdminDashboard();
  else if(App.adminTab === 'dealers') { body.innerHTML = viewAdminDealers(); bindAdminDealers(); }
  else if(App.adminTab === 'products') { body.innerHTML = viewAdminProducts(); bindAdminProducts(); }
  else if(App.adminTab === 'pending') { body.innerHTML = viewAdminOrders('pending'); bindAdminOrders(); }
  else if(App.adminTab === 'approved') { body.innerHTML = viewAdminOrders('approved'); bindAdminOrders(); }
  else if(App.adminTab === 'reports') { body.innerHTML = viewAdminReports(); bindAdminReports(); }
  else if(App.adminTab === 'offers') { body.innerHTML = viewAdminOffers(); bindAdminOffers(); }
}

function bindAdminDealers() {
  const open = (d)=>{
    showModal({
      title: d?'Edit':'Add',
      body: `<div class="field"><label>Name</label><input id="dl-name" autocomplete="off" value="${d?escapeHtml(d.name):''}" /></div>
             <div class="field"><label>Code</label><input id="dl-code" autocomplete="off" value="${d?escapeHtml(d.code):''}" /></div>`,
      buttons: [{ label:'Cancel', class:'btn-ghost', onClick: closeModal }, { label:'Save', class:'btn-primary', onClick: ()=>{
        const name = $('#dl-name').value.trim(), code = $('#dl-code').value.trim();
        if(!name||!code) return;
        if(d) Store.updateDealer({ ...d, name, code }); else Store.addDealer({ id: uid('dl'), name, code, point:'', slabs:{} });
        closeModal(); renderAdminTab();
      }}]
    });
  };

  const openSlabs = (d) => {
    const slabs = d.slabs || {};
    let rowsHtml = Object.keys(slabs).sort().map(date => `
      <div class="flex-between" style="background:#f1f5f9; padding:8px; border-radius:6px; margin-bottom:4px; width:100%;">
        <div>${formatDate(date)}: <b>${slabs[date]} Slab</b></div>
        <button type="button" class="icon-btn danger btn-sm" onclick="deleteSlab('${d.id}', '${date}')" style="width:auto; padding:4px 8px;">Delete</button>
      </div>
    `).join('');

    showModal({
      title: 'Slab Settings — ' + d.name,
      body: `
        <div style="width:100%; margin-bottom:15px;">
          <h4>Existing Slabs</h4>
          ${rowsHtml || '<div class="small muted">No slabs set.</div>'}
        </div>
        <hr style="width:100%; border:none; border-top:1px solid #cbd5e1; margin-bottom:15px;">
        <h4 style="width:100%;">Add New Slab</h4>
        <div class="field"><label>Date</label><input type="date" autocomplete="off" id="slab-date" value="${todayStr()}" /></div>
        <div class="field"><label>Minimum Slab Quantity</label><input type="number" autocomplete="off" id="slab-qty" placeholder="e.g. 20" /></div>
      `,
      buttons: [
        { label:'Close', class:'btn-ghost', onClick: closeModal },
        { label:'Add Slab', class:'btn-primary', onClick: ()=>{
          const date = $('#slab-date').value;
          const qty = Number($('#slab-qty').value);
          if(!date || qty <= 0) return toast('Date & Qty দিন', 'err');
          const dealerObj = Store.getDealerById(d.id);
          if(!dealerObj.slabs) dealerObj.slabs = {};
          dealerObj.slabs[date] = qty;
          Store.updateDealer(dealerObj);
          toast('Slab Added', 'ok'); closeModal(); renderAdminTab();
        }}
      ]
    });
  };

  window.deleteSlab = (dealerId, date) => {
    const dealerObj = Store.getDealerById(dealerId);
    if(dealerObj && dealerObj.slabs) { delete dealerObj.slabs[date]; Store.updateDealer(dealerObj); }
    closeModal(); renderAdminTab();
  };

  $('#add-dealer-btn').onclick = ()=>open(null);
  $$('#dealers-list .list-item').forEach(el=>{
    el.querySelector('[data-act=edit]').onclick = ()=>open(Store.getDealerById(el.dataset.id));
    el.querySelector('[data-act=slabs]').onclick = ()=>openSlabs(Store.getDealerById(el.dataset.id));
    el.querySelector('[data-act=del]').onclick = ()=>{ if(confirm('Delete?')) { Store.deleteDealer(el.dataset.id); renderAdminTab(); } };
  });
}

          Store.addOffer({ id: uid('of'), ...v }); toast('Offer Created','ok'); closeModal(); renderAdminTab();
        }}
      ]
    });

    const calcPercent = () => {
      const opt = $('#of-free-prod').selectedOptions[0];
      const price = Number(opt && opt.dataset.price || 0);
      const slab = Number($('#of-slab').value || 0);
      const percent = slab > 0 ? (price / slab) * 100 : 0;
      $('#of-percent').textContent = percent.toFixed(2) + '%';
    };
    $$('#of-free-prod, #of-slab').forEach(inp => {
      inp.addEventListener('input', calcPercent);
      inp.addEventListener('change', calcPercent);
    });
  };

  $('#add-offer-btn').onclick = ()=>open();

  $$('.active-radio').forEach(radio => {
    radio.onchange = (e) => {
      const activeId = e.target.dataset.id;
      Store.getOffers().forEach(o => {
        o.isActive = (o.id === activeId);
        Store.updateOffer(o);
      });
      toast('Active offer updated', 'ok');
      renderAdminTab();
    };
  });

  $$('#offers-list .list-item').forEach(el=>{
    el.querySelector('[data-act=del]').onclick = ()=>{ if(confirm('Delete Offer?')) { Store.deleteOffer(el.dataset.id); renderAdminTab(); } };
  });
}

function openAdminOrderEdit(orderId) {
  const o = Store.getOrderById(orderId);
  if(!o) return;
  let rowsHtml = o.items.map((it, idx) => {
    let qtyHtml = '';
    if(it.hasFlavors) {
      qtyHtml = `<div style="display:flex; gap:4px; flex-wrap:wrap;">${Object.keys(it.flavors).map(f=>`
        <div style="width:45px;"><div class="small muted" style="text-align:center; font-size:9px;">${escapeHtml(f.substring(0,3))}</div>
        <input type="number" min="0" autocomplete="off" class="edit-flav" data-idx="${idx}" data-flav="${escapeHtml(f)}" value="${it.flavors[f]||0}" style="padding:4px; text-align:center; font-size:12px;"></div>`).join('')}</div>`;
    } else {
      qtyHtml = `<input type="number" min="0" autocomplete="off" class="edit-direct" data-idx="${idx}" value="${it.totalCartons||0}" style="padding:4px; text-align:center; width:60px;">`;
    }
    return `<tr><td style="text-align:center;">${idx+1}</td><td style="font-size:12px;">${escapeHtml(it.name)}</td><td>${qtyHtml}</td><td class="text-right" data-amt="${idx}">${fmt(it.amount)}</td></tr>`;
  }).join('');

  showModal({
    title: 'Edit Order — ' + o.dealerName, fullscreen: true,
    body: `<div style="width:100%; max-width:800px; overflow-x:auto;"><table class="sheet-table" style="min-width:400px;"><tr class="bg-header-orange"><td>Sl</td><td>Product</td><td>Qty</td><td>Amount</td></tr>${rowsHtml}<tr class="bg-grandtotal"><td colspan="2" class="text-center">Total</td><td class="text-center" id="edit-grand-ctn">${o.grandCartons}</td><td class="text-right" id="edit-grand-amt">${fmt(o.grandAmount)}</td></tr></table></div>`,
    buttons: [
      { label:'Close', class:'btn-ghost', onClick: closeModal },
      { label:'Save', class:'btn-primary', onClick: ()=>{
        let c=0, a=0;
        o.items.forEach((it, idx) => {
          if(it.hasFlavors) { it.totalCartons = 0; $$(`.edit-flav[data-idx="${idx}"]`).forEach(inp => { const v = Number(inp.value||0); it.flavors[inp.dataset.flav] = v; it.totalCartons += v; }); }
          else it.totalCartons = Number($(`.edit-direct[data-idx="${idx}"]`).value||0);
          it.amount = it.totalCartons * it.price; c += it.totalCartons; a += it.amount;
        });
        o.grandCartons = c; o.grandAmount = a; Store.updateOrder(o); toast('Updated'); closeModal(); renderAdminTab();
      }},
      ...(o.status==='pending' ? [{ label:'Approve', class:'btn-success', onClick: ()=>{ o.status = 'approved'; Store.updateOrder(o); closeModal(); renderAdminTab(); }}] : [])
    ]
  });

  $$('.edit-direct, .edit-flav').forEach(inp => {
    inp.oninput = () => {
      let c=0, a=0;
      o.items.forEach((it, idx) => {
        if(it.hasFlavors) {
          let fTotal=0;
          $$(`.edit-flav[data-idx="${idx}"]`).forEach(fi => fTotal += Number(fi.value||0));
          c += fTotal; a += (fTotal * it.price);
          const cell = $(`[data-amt="${idx}"]`); if(cell) cell.textContent = fmt(fTotal * it.price);
        } else {
          const v = Number($(`.edit-direct[data-idx="${idx}"]`).value||0);
          c += v; a += (v * it.price);
          const cell = $(`[data-amt="${idx}"]`); if(cell) cell.textContent = fmt(v * it.price);
        }
      });
      $('#edit-grand-ctn').textContent = c;
      $('#edit-grand-amt').textContent = fmt(a);
    };
  });
}

/* --- Order Section --- */
function initDraftItems() {
  App.draft.items = [];
  Store.getProducts().forEach(p => {
    const flavors = {};
    if(p.flavors) p.flavors.forEach(f=>flavors[f]=0);
    App.draft.items.push({ productId:p.id, categoryId:p.categoryId, name:p.name, price:p.price, hasFlavors:!!(p.flavors&&p.flavors.length), flavors, totalCartons:0, amount:0 });
  });
}

function initDraft(dealer) {
  App.draft = { dealerId: null, dealerName: 'ডিলার সিলেক্ট', dealerCode: '', date: todayStr(), items: [], slabQty: 0, grandAmount: 0 };
  initDraftItems();
}

function renderDealerOrderScreen(dealer) {
  if(!App.draft) initDraft(dealer);

  $('#app').innerHTML = `
    <div class="order-screen">
      <div class="order-toolbar">
        <button type="button" class="icon-btn" id="back-btn">${Ico.back}</button>
        <input type="date" id="order-date" autocomplete="off" value="${App.draft.date}" style="max-width:140px; padding:6px;" />
        <button type="button" class="btn btn-outline btn-sm" id="sel-dealer-btn" style="flex:1; min-width:0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${escapeHtml(App.draft.dealerName)}</button>
      </div>
      <div class="order-scroll">
        <div class="prod-header"><div>প্রোডাক্ট</div><div style="text-align:center;">কার্টন</div><div style="text-align:right;">অ্যামাউন্ট</div><div style="padding-left:5px;">ফ্লেভার</div></div>
        <div id="prod-rows">${App.draft.items.map((it, idx)=>{
          if(it.hasFlavors) return `<div class="prod-row" data-idx="${idx}"><div class="pname">${escapeHtml(it.name)}</div><div class="prod-total-qty" data-cartons="${idx}">0</div><div class="amt" data-amount="${idx}">0</div>
            <div class="flavors">${Object.keys(it.flavors).map(f=>`<div class="flavor-cell"><label>${escapeHtml(f)}</label><input type="number" min="0" autocomplete="off" class="flav-inp" data-idx="${idx}" data-flav="${escapeHtml(f)}" value="" placeholder="0"></div>`).join('')}</div></div>`;
          return `<div class="prod-row" data-idx="${idx}"><div class="pname">${escapeHtml(it.name)}</div><div><input type="number" min="0" autocomplete="off" class="qty direct-inp" data-idx="${idx}" value="" placeholder="0"></div><div class="amt" data-amount="${idx}">0</div><div class="muted small">—</div></div>`;
        }).join('')}</div>
      </div>
      <div class="fixed-summary">
        <div class="fs-top-row">
          <div><span class="lbl">TOTAL:</span> <span class="v" id="fs-cartons">0</span></div>
          <div><span class="lbl">AMOUNT:</span> <span class="v" id="fs-amount">0</span></div>
        </div>
        <div class="offer-hint" id="offer-hint"></div>
        <div class="fs-bottom-row">
          <div class="slab-wrap">
            <span style="font-size:11px; font-weight:bold;">স্ল্যাব:</span>
            <input type="number" min="0" autocomplete="off" id="slab-input" value="${App.draft.slabQty||''}" placeholder="0">
            <span class="slab-live-total" id="slab-live-total">৳ 0</span>
          </div>
          <button type="button" class="btn btn-primary" id="submit-order">Submit</button>
        </div>
      </div>
    </div>`;

  const getOffer = () => Store.getActiveOfferOn($('#order-date').value);

  const updateSlabDisplay = () => {
    const offer = getOffer();
    const slabInp = $('#slab-input');
    slabInp.disabled = !offer;
    if(!offer) { App.draft.slabQty = 0; slabInp.value = ''; }
    $('#offer-hint').textContent = offer ? `প্রতি ৳${fmt(offer.slabAmount)} এ ${offer.freeCarton}টি ফ্রি` : '';
    $('#slab-live-total').textContent = '৳ ' + fmt((App.draft.slabQty||0) * (offer ? offer.slabAmount : 0));
  };

  const updateSlabInput = () => {
    const offer = getOffer();
    if(offer && App.draft.dealerId) {
      const d = Store.getDealerById(App.draft.dealerId);
      const date = $('#order-date').value;
      if(d && d.slabs && d.slabs[date]) {
        $('#slab-input').value = d.slabs[date];
        App.draft.slabQty = d.slabs[date];
        toast(`অটোমেটিক স্ল্যাব ${d.slabs[date]} সেট হয়েছে`, 'ok');
      }
    }
    updateSlabDisplay();
  };

  const recalc = ()=>{
    let c=0, a=0;
    $$('.prod-row').forEach(row=>{
      const idx = row.dataset.idx, it = App.draft.items[idx];
      if(it.hasFlavors) it.totalCartons = Object.values(it.flavors).reduce((s,v)=>s+Number(v||0),0);
      else it.totalCartons = Number($('.direct-inp', row).value||0);
      it.amount = it.totalCartons * it.price; c+=it.totalCartons; a+=it.amount;
      const cEl = $(`[data-cartons="${idx}"]`), aEl = $(`[data-amount="${idx}"]`);
      if(cEl) cEl.textContent = it.totalCartons;
      if(aEl) aEl.textContent = fmt(it.amount);
    });
    $('#fs-cartons').textContent = c; $('#fs-amount').textContent = fmt(a);
    App.draft.grandAmount = a;
  };

  $('#back-btn').onclick = ()=>{ App.dealerTab='home'; App.draft=null; renderDealer(dealer); };

  $('#sel-dealer-btn').onclick = ()=>{
    showModal({
      title: 'ডিলার সিলেক্ট করুন',
      body: `<div class="dealer-pick-grid">${Store.getDealers().map(d=>`
        <div class="dealer-pick-card" data-did="${d.id}">
          <div><div style="font-weight:700;">${escapeHtml(d.name)}</div><div class="small muted">${escapeHtml(d.code)}</div></div>
        </div>`).join('')}</div>`,
      buttons: [{ label:'Cancel', class:'btn-ghost', onClick: closeModal }]
    });
    $$('.dealer-pick-card').forEach(c => c.onclick = ()=>{
      const d = Store.getDealerById(c.dataset.did);
      if(!d) return;
      App.draft.dealerId = d.id;
      App.draft.dealerName = d.name;
      App.draft.dealerCode = d.code;
      $('#sel-dealer-btn').textContent = d.name;
      toast('ডিলার সিলেক্ট হয়েছে', 'ok'); closeModal(); updateSlabInput();
    });
  };

  $$('.direct-inp').forEach(i=> i.oninput = recalc);
  $$('.flav-inp').forEach(i=> i.oninput = ()=>{ App.draft.items[i.dataset.idx].flavors[i.dataset.flav] = Number(i.value||0); recalc(); });

  $('#order-date').onchange = ()=>{ App.draft.date = $('#order-date').value; updateSlabInput(); };

  $('#slab-input').oninput = (e) => {
    App.draft.slabQty = Number(e.target.value||0);
    updateSlabDisplay();
  };

  $('#submit-order').onclick = ()=>{
    if(!App.draft.dealerId) return toast('আগে ডিলার সিলেক্ট করুন', 'err');
    recalc();
    const items = App.draft.items.filter(i=>i.totalCartons>0);
    if(!items.length) return toast('কার্টন দিন','err');

    const offer = getOffer();
    let slabTotal = 0, freeQty = 0;
    if(offer) {
      slabTotal = (App.draft.slabQty||0) * offer.slabAmount;
      freeQty = (App.draft.slabQty||0) * offer.freeCarton;
    }

    if(slabTotal > 0 && App.draft.grandAmount < slabTotal) {
      return toast(`আপনার অর্ডার ${fmt(App.draft.grandAmount)} টাকা, কিন্তু স্ল্যাবের জন্য ${fmt(slabTotal)} টাকা লাগবে!`, 'err');
    }

    const order = {
      id: uid('ord'), dealerId: App.draft.dealerId, dealerName: App.draft.dealerName, dealerCode: App.draft.dealerCode || '', date: $('#order-date').value,
      items, grandCartons: items.reduce((s,i)=>s+i.totalCartons,0), grandAmount: App.draft.grandAmount,
      slabQty: slabTotal > 0 ? App.draft.slabQty : 0, slabTotal, freeQty, status: 'pending', createdAt: Date.now()
    };
    Store.addOrder(order); toast('Order Submitted','ok'); App.dealerTab='home'; App.draft=null; renderDealer(dealer);
  };

  updateSlabDisplay();
}

/* --- Modal --- */
let mb = null;
function showModal({ title, body, buttons, fullscreen=false }) {
  closeModal();
  mb = document.createElement('div'); mb.className = 'modal-overlay';
  mb.innerHTML = `<div class="modal ${fullscreen?'fullscreen':''}">
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button type="button" class="icon-btn" id="mx">${Ico.close}</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot" id="mf"></div></div>`;
  document.body.appendChild(mb);
  $('#mx', mb).onclick = closeModal;
  (buttons||[]).forEach(b=>{ const btn = document.createElement('button'); btn.type='button'; btn.className = 'btn ' + b.class; btn.textContent = b.label; btn.onclick = b.onClick; $('#mf', mb).appendChild(btn); });
}
function closeModal() { if(mb) { mb.remove(); mb = null; } }

/* --- Summary Generation --- */
function generateOrderHTML(order) {
  const cats = Store.getCategories(); const products = Store.getProducts();
  const orderedMap = new Map(); order.items.forEach(it => { if(it.totalCartons > 0) orderedMap.set(it.productId, it); });
  let grandCartons = 0, grandAmount = 0; const rows = [];

  cats.forEach(cat => {
    const catProducts = products.filter(p => p.categoryId === cat.id);
    if(catProducts.length === 0) return;
    const catColorClass = cat.tag === 'core' ? 'bg-cat-blue' : cat.tag === 'value' ? 'bg-cat-green' : cat.tag === 'emergency' ? 'bg-cat-yellow' : 'bg-cat-orange';
    rows.push(`<tr><td colspan="5" class="${catColorClass}" style="text-align:center;">"${escapeHtml(cat.name)}" Products Details</td></tr>`);

    let catCartons = 0, catAmount = 0;
    catProducts.forEach((p, i) => {
      const it = orderedMap.get(p.id); let qty = 0, amt = 0, flavorStr = '';
      if (it) {
        qty = it.totalCartons; amt = it.amount; catCartons += qty; catAmount += amt;
        if (it.hasFlavors) {
          const flavors = Object.entries(it.flavors || {}).filter(([,v]) => v > 0);
          if (flavors.length > 0) flavorStr = flavors.map(([fname, q]) => `${escapeHtml(fname.charAt(0).toUpperCase())}-${q}`).join(', ');
        }
      }
      rows.push(`<tr><td class="text-center">${i + 1}</td><td style="padding-left:4px;">${escapeHtml(p.name)}</td><td class="text-center">${qty > 0 ? qty : ''}</td><td class="text-right">${amt > 0 ? fmt(amt) : ''}</td><td class="flavor-text text-center">${flavorStr}</td></tr>`);
    });
    rows.push(`<tr class="bg-subtotal"><td colspan="2" class="text-center">"${escapeHtml(cat.name)}" Order Value</td><td class="text-center">${catCartons > 0 ? catCartons : '0'}</td><td class="text-right">${catAmount > 0 ? fmt(catAmount) : '0'}</td><td></td></tr>`);
    grandCartons += catCartons; grandAmount += catAmount;
  });

  let offerRow = '';
  if (order.slabQty > 0) {
    offerRow = `<tr class="bg-offer"><td colspan="2" class="text-center">Free Product Qty. or Slab Quantity</td><td class="text-center">${order.freeQty}</td><td class="text-right">${fmt(order.slabTotal)}</td><td></td></tr>`;
  }

  return `
    <table class="sheet-table">
      <tr><td colspan="5" class="bg-header-green" style="font-size:13px;">DB Name: ${escapeHtml(order.dealerName)}</td></tr>
      <tr><td colspan="2" class="text-center" style="background:#fff;">Date: ${formatDate(order.date)}</td><td colspan="3" class="bg-header-green">DB Code: ${escapeHtml(order.dealerCode || '')}</td></tr>
      <tr><td colspan="5" style="background:#fff; height:2px; padding:0; border:none;"></td></tr>
      <tr class="bg-header-orange">
        <td style="width: 8%;">Sl No.</td>
        <td style="width: 37%;">Product Description</td>
        <td style="width: 12%;">Quantity-Ctn</td>
        <td style="width: 15%;">Amount-TK.</td>
        <td style="width: 28%;">Flavour</td>
      </tr>
      ${rows.join('')}
      <tr class="bg-grandtotal"><td colspan="2" class="text-center">Grand Total</td><td class="text-center">${grandCartons}</td><td class="text-right">${fmt(grandAmount)}</td><td></td></tr>
      ${offerRow}
    </table>
  `;
}

function openInvoicePreview(orderId) {
  const o = Store.getOrderById(orderId); if(!o) return;
  showModal({
    title: 'Summary — ' + o.dealerName, fullscreen: true,
    body: `<div class="invoice-preview" style="width:100%; overflow-x:hidden;">${generateOrderHTML(o)}</div>`,
    buttons: [
      { label:'Close', class:'btn-ghost', onClick: closeModal },
      { label:'Download Image', class:'btn-primary', onClick: ()=>{ downloadImage(orderId); } }
    ]
  });
}

function downloadImage(orderId) {
  const o = Store.getOrderById(orderId); if(!o) return;
  if(typeof html2canvas === 'undefined') return toast('ইন্টারনেট চালু করে আবার চেষ্টা করুন', 'err');
  toast('ছবি তৈরি হচ্ছে, দয়া করে অপেক্ষা করুন...');

  const area = $('#image-render-area');
  area.innerHTML = `<div class="invoice-preview" style="width:100%;">${generateOrderHTML(o)}</div>`;

  html2canvas(area, { scale: 2, backgroundColor:'#ffffff' }).then(canvas => {
    canvas.toBlob((blob) => {
      area.innerHTML = '';
      if(!blob) return toast('ছবি তৈরি করা সম্ভব হয়নি', 'err');
      const url = URL.createObjectURL(blob);
      const win = window.open();
      if(win) {
        win.document.write(`<body style="margin:0; display:flex; justify-content:center; background:#333;"><img src="${url}" style="max-width:100%; height:auto;" /></body>`);
        toast('নতুন ট্যাবে ছবি ওপেন হয়েছে, সেখানে চাপ দিয়ে ধরে "Save Image" করুন।', 'ok');
      } else {
        const a = document.createElement('a');
        a.href = url; a.download = (o.invoiceNo || 'order') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        toast('ছবি ডাউনলোড হয়েছে', 'ok');
      }
    }, 'image/png');
  }).catch(err => {
    toast('ছবি তৈরি করতে সমস্যা হয়েছে', 'err');
    area.innerHTML = '';
  });
}

window.addEventListener('DOMContentLoaded', () => { render(); setupBackHandler(); });
</script>
</body>
